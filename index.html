<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff4d6d">
  <title>test-2</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #ff4d6d; transition: background-color 700ms ease; }
    #message {
      position: fixed; left: 0; top: 0;
      font: 700 clamp(36px, 9vw, 120px)/1 Arial, sans-serif;
      letter-spacing: -0.06em; white-space: nowrap; color: #fff;
      user-select: none; will-change: transform;
    }
  </style>
</head>
<body>
  <div id="message">fuck you</div>
  <script>
    const message = document.getElementById('message');
    const colors = ['#ff4d6d','#5b5bd6','#00a896','#f28c28','#22223b','#e63946','#386641','#7b2cbf','#0081a7','#d81159','#4f772d','#fb5607'];
    let x = 40, y = 50, vx = 3.2, vy = 2.5;
    let last = performance.now();
    function randomColor() {
      const current = getComputedStyle(document.body).backgroundColor;
      let next;
      do { next = colors[Math.floor(Math.random() * colors.length)]; }
      while (next === current);
      document.body.style.backgroundColor = next;
    }
    setInterval(randomColor, 2000);
    function animate(now) {
      const scale = Math.min((now - last) / 16.67, 2);
      last = now;
      const maxX = Math.max(0, innerWidth - message.offsetWidth);
      const maxY = Math.max(0, innerHeight - message.offsetHeight);
      x += vx * scale; y += vy * scale;
      if (x <= 0 || x >= maxX) { x = Math.max(0, Math.min(x, maxX)); vx *= -1; }
      if (y <= 0 || y >= maxY) { y = Math.max(0, Math.min(y, maxY)); vy *= -1; }
      message.style.transform = `translate(${x}px, ${y}px)`;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>

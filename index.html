<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <title>test-2 — a little corner of the internet</title>
  <style>
    :root { color-scheme: light; --ink: #25271f; --paper: #f5f1e9; --orange: #f1683b; --green: #55715a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "Arial", sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 5vw; border-bottom: 1px solid #25271f30; }
    .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -.04em; }
    .status { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--green); }
    main { min-height: calc(100vh - 72px); display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 5vw; padding: 8vw 10vw; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .16em; color: var(--orange); }
    h1 { max-width: 700px; margin: 20px 0; font-size: clamp(56px, 10vw, 132px); line-height: .84; letter-spacing: -.09em; font-weight: 700; }
    p { max-width: 410px; font-size: 18px; line-height: 1.55; color: #55564d; }
    .shape { width: min(30vw, 360px); aspect-ratio: 1; justify-self: center; position: relative; border-radius: 48% 52% 60% 40% / 48% 44% 56% 52%; background: var(--orange); transform: rotate(-12deg); }
    .shape::before { content: ""; position: absolute; inset: 16%; border: 1px solid var(--paper); border-radius: 50%; }
    .shape::after { content: "02"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--paper); font-size: clamp(68px, 12vw, 150px); font-weight: 700; letter-spacing: -.1em; transform: rotate(12deg); }
    footer { position: fixed; bottom: 0; left: 0; width: 100%; padding: 18px 5vw; font-size: 11px; color: #77776d; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; padding: 14vw 8vw 24vw; } .shape { width: 52vw; } }
  </style>
</head>
<body>
  <header><div class="wordmark">test-2</div><div class="status">A new beginning · 2026</div></header>
  <main>
    <section><div class="eyebrow">A little corner of the internet</div><h1>Hello,<br>world.</h1><p>This is test-2: a fresh space to experiment, make things, and see where they go.</p></section>
    <div class="shape" aria-hidden="true"></div>
  </main>
  <footer>Made with curiosity. &nbsp;✳</footer>
</body>
</html>
